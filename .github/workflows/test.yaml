name: Run on Push (Any Branch)

on:
  push:
    branches:
      - '**'  # This matches any branch

jobs:
  run-on-any-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Branch Name
        run: echo "Triggered by push on branch: '${{ github.ref_name }}'"
